<style>
  :root{
    --brand:#0f766e;
    --brand-dark:#0b544e;
    --brand-light:#e6f5f3;
    --accent:#f59e0b;
    --ink:#1c2b2a;          /* warmer near-black, hint of the brand */
    --muted:#6b7770;        /* warm grey */
    --line:#e9e6e0;         /* warm hairline */
    --bg:#faf9f7;           /* Airbnb-style warm off-white */
    --card:#ffffff;
    --danger:#e01e5a;
    --radius:16px;
    --display:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --shadow-sm:0 1px 2px rgba(28,43,42,.06);
    --shadow-md:0 6px 20px rgba(28,43,42,.08);
    --shadow-lg:0 12px 34px rgba(28,43,42,.12);
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    margin:0;
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  h1,h2,h3,h4,.card-title,.brand,.price{font-family:var(--display);letter-spacing:-.01em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .app{display:flex;flex-direction:column;min-height:100vh;}

  /* NAVBAR */
  .navbar{
    position:sticky;top:0;z-index:40;
    background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--brand-dark);}
  .brand .dot{color:var(--accent);}
  .navtabs{display:flex;gap:4px;background:var(--brand-light);padding:4px;border-radius:999px;flex-wrap:wrap;}
  .navtab{
    border:none;background:transparent;padding:8px 16px;border-radius:999px;
    font-size:14px;font-weight:600;color:var(--brand-dark);opacity:.65;
  }
  .navtab.active{background:var(--brand);color:#fff;opacity:1;box-shadow:0 2px 6px rgba(15,118,110,.35);}
  .navtab:hover{opacity:1;}
  .navcta{
    background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:999px;
    font-weight:700;font-size:14px;
  }
  .navcta.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .navright{display:flex;gap:8px;align-items:center;}

  main{flex:1;width:100%;}
  .wrap{max-width:1180px;margin:0 auto;padding:24px;}

  .hero{
    position:relative;isolation:isolate;overflow:hidden;
    background:linear-gradient(135deg,var(--brand) 0%,#134e4a 100%);
    color:#fff;padding:36px 24px;
  }
  /* Photos crossfade underneath; the teal wash keeps the brand identity
     and guarantees text contrast whichever frame is showing. */
  .hero-photo{
    position:absolute;inset:0;background-size:cover;background-position:center 42%;
    opacity:0;transition:opacity 1.4s ease-in-out;z-index:-2;
  }
  .hero-photo.show{opacity:1;}
  .hero::before{
    content:'';position:absolute;inset:0;z-index:-1;
    background:linear-gradient(135deg,rgba(15,118,110,.9) 0%,rgba(19,78,74,.82) 55%,rgba(19,78,74,.62) 100%);
  }
  .hero-credit{
    position:absolute;right:10px;bottom:8px;font-size:9.5px;opacity:.62;letter-spacing:.01em;
    z-index:1;max-width:60%;text-align:right;line-height:1.35;
  }
  .hero-dots{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:1;}
  .hero-dot{
    width:7px;height:7px;border-radius:50%;border:none;padding:0;cursor:pointer;
    background:rgba(255,255,255,.45);transition:.2s;
  }
  .hero-dot.active{background:#fff;transform:scale(1.25);}
  .hero h1{margin:0 0 6px;font-size:28px;text-shadow:0 1px 12px rgba(0,0,0,.28);}
  .hero p{margin:0 0 20px;opacity:.95;font-size:15px;max-width:640px;text-shadow:0 1px 10px rgba(0,0,0,.25);}
  .searchbar{
    background:#fff;border-radius:999px;display:flex;align-items:center;gap:8px;
    padding:6px 6px 6px 18px;max-width:640px;box-shadow:0 10px 30px rgba(0,0,0,.15);
  }
  .searchbar input{
    flex:1;border:none;outline:none;font-size:15px;padding:10px 0;color:var(--ink);
  }
  .searchbar button{
    background:var(--brand);color:#fff;border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14px;
  }
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .chip{
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;
    padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;
  }
  .chip.active{background:#fff;color:var(--brand-dark);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px;flex-wrap:wrap;gap:10px;}
  .toolbar h2{margin:0;font-size:18px;}
  .toolbar select{
    padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
  /* Airbnb-style: borderless card, rounded photo, quiet type, heart to save */
  .card{
    background:transparent;border-radius:0;overflow:visible;border:none;
    cursor:pointer;transition:transform .18s ease;
  }
  .card:hover{transform:translateY(-2px);}
  .card:hover .card-photo img{transform:scale(1.04);}
  .card-photo{
    height:210px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;
    overflow:hidden;background-size:cover;background-position:center;border-radius:14px;
    box-shadow:var(--shadow-sm);
  }
  .card-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;}
  .photo-count{
    position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;
    font-weight:600;padding:3px 9px;border-radius:999px;backdrop-filter:blur(4px);
  }
  .card-heart{
    position:absolute;top:11px;right:11px;width:32px;height:32px;border:none;border-radius:50%;
    background:transparent;color:#fff;font-size:19px;line-height:1;cursor:pointer;z-index:2;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));transition:transform .15s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .card-heart:hover{transform:scale(1.15);}
  .card-heart.saved{color:var(--danger);}
  .plan-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
  .plan-tab{
    position:relative;padding:10px 6px 9px;border-radius:12px;border:2px solid var(--line);background:#fff;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s;
  }
  .plan-tab:hover{border-color:#99f6e4;background:#f0fdfa;}
  .plan-tab.active{border-color:var(--brand);background:#f0fdfa;box-shadow:0 0 0 3px rgba(15,118,110,.1);}
  .plan-name{font-size:12px;font-weight:800;color:var(--ink);}
  .plan-rate{font-size:12px;font-weight:700;color:var(--brand);}
  .plan-save{
    position:absolute;top:-8px;right:-4px;background:#15803d;color:#fff;font-size:9px;font-weight:800;
    padding:2px 6px;border-radius:999px;letter-spacing:.02em;
  }
  @media (max-width:520px){
    .plan-tabs{grid-template-columns:repeat(2,1fr);}
  }
  .rate-strip{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px;}
  .rate-strip b{color:var(--ink);font-weight:800;}
  /* --- verification, documents, chat --- */
  .verified-chip{background:#dcfce7;color:#15803d;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid #86efac;}
  .navcta.small{padding:7px 12px;font-size:12px;}
  .verify-banner{border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:10px;line-height:1.45;}
  .verify-banner.ok{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
  .verify-banner.warn{background:#fef9c3;color:#854d0e;border:1px solid #fde047;}
  .link-btn{background:none;border:none;color:var(--brand);font-weight:800;cursor:pointer;padding:0;font-size:inherit;text-decoration:underline;}
  .doc-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .doc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .doc-info{display:flex;align-items:center;gap:8px;flex:1;min-width:150px;}
  .doc-icon{font-size:20px;}
  .doc-label{font-size:13px;font-weight:700;}
  .doc-upload{background:#fff;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:12px;padding:7px 14px;border-radius:9px;cursor:pointer;}
  .doc-upload:disabled{opacity:.6;cursor:wait;}
  .doc-done{display:flex;align-items:center;gap:8px;}
  .doc-thumb{width:38px;height:38px;object-fit:cover;border-radius:7px;border:1px solid var(--line);}
  .doc-check{font-size:12px;font-weight:800;color:#15803d;}
  .doc-replace{background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;}
  .chat-modal{max-width:460px;display:flex;flex-direction:column;max-height:82vh;padding:0;overflow:hidden;}
  .chat-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);}
  .chat-host-avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;}
  .chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-height:220px;}
  .chat-empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;line-height:1.5;}
  .chat-bubble{max-width:78%;padding:9px 13px;border-radius:15px;font-size:13.5px;line-height:1.4;position:relative;}
  .chat-bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px;}
  .chat-bubble.host{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}
  .chat-sender{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:2px;}
  .chat-verify-note{font-size:11.5px;color:#854d0e;background:#fef9c3;padding:8px 14px;border-top:1px solid #fde047;}
  .chat-input{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line);}
  .chat-input input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;}
  .chat-input .btn-primary{padding:10px 18px;}
  .photo-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
  .photo-thumb{
    position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);background:#f1f5f9;
  }
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-cover{
    position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;
    font-weight:800;padding:2px 6px;border-radius:999px;letter-spacing:.03em;
  }
  .photo-remove{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .photo-remove:hover{background:#b91c1c;}
  .photo-add{
    width:96px;height:96px;border-radius:12px;border:2px dashed var(--line);background:#f8fafc;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:11px;font-weight:700;color:var(--muted);transition:.15s;
  }
  .photo-add:hover:not(:disabled){border-color:var(--brand);color:var(--brand);background:#f0fdfa;}
  .photo-add:disabled{cursor:wait;opacity:.6;}
  .gallery{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;}
  .gallery img{
    width:88px;height:66px;object-fit:cover;border-radius:9px;cursor:pointer;flex:0 0 auto;
    border:2px solid transparent;transition:.15s;
  }
  .gallery img.active{border-color:var(--brand);}
  .badge-new{
    position:absolute;top:11px;left:11px;background:#fff;color:var(--brand-dark);font-size:11px;font-weight:700;
    padding:4px 11px;border-radius:999px;box-shadow:var(--shadow-sm);
  }
  .badge-rating{display:none;} /* rating now sits inline with the title, Airbnb-style */
  .card-body{padding:11px 2px 4px;}
  .card-titlerow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .card-title{font-weight:600;font-size:15px;margin:0;line-height:1.3;color:var(--ink);}
  .card-rating-inline{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:3px;}
  .card-rating-inline.new{color:var(--muted);}
  .card-area{color:var(--muted);font-size:13.5px;margin:2px 0 6px;}
  .card-amenities{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .amenity-pill{font-size:11px;background:var(--brand-light);color:var(--brand-dark);padding:3px 8px;border-radius:999px;font-weight:600;}
  .card-footer{display:flex;justify-content:space-between;align-items:baseline;}
  .price{font-weight:700;font-size:15px;color:var(--ink);}
  .price span{font-weight:400;font-size:13.5px;color:var(--ink);}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-saved{text-align:center;padding:70px 20px;color:var(--muted);}
  .empty-saved h3{margin:10px 0 4px;font-size:20px;color:var(--ink);}

  /* MAP */
  .map-wrap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);height:560px;}
  #leaflet-map{height:100%;width:100%;}
  .price-pin{
    background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:5px 9px;border-radius:999px;
    box-shadow:0 3px 8px rgba(0,0,0,.3);white-space:nowrap;border:2px solid #fff;
  }
  .price-pin.mine{background:var(--accent);}
  .popup-card{min-width:180px;font-family:inherit;}
  .popup-card h4{margin:0 0 4px;font-size:14px;}
  .popup-card p{margin:0 0 8px;font-size:12px;color:var(--muted);}
  .popup-card button{
    background:var(--brand);color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;width:100%;
  }
  /* --- public/free parking pins + vacancy --- */
  .public-pin{
    width:30px;height:38px;position:relative;display:flex;align-items:center;justify-content:center;
  }
  .public-pin::before{
    content:'';position:absolute;top:0;left:0;width:30px;height:30px;background:#fff;
    border:3px solid var(--vac);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 6px rgba(0,0,0,.3);
  }
  .public-pin span{position:relative;z-index:1;font-weight:900;font-size:14px;color:var(--vac);}
  .vac-status{font-weight:800!important;font-size:12px!important;margin:6px 0 2px!important;}
  .vac-btns{display:flex;flex-direction:column;gap:5px;}
  .popup-card .vac-btn{
    background:#fff;border:1.5px solid;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:800;
    width:100%;text-align:left;cursor:pointer;
  }
  /* --- auth / accounts --- */
  .account-box{display:flex;align-items:center;gap:8px;}
  .account-chip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:6px 12px;border-radius:999px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mini-verified{background:#dcfce7;color:#15803d;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;}
  .auth-tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px;}
  .auth-tab{flex:1;padding:9px;border:none;background:none;border-radius:9px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;}
  .auth-tab.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .auth-label{font-size:13px;font-weight:700;display:block;margin-bottom:8px;}
  .role-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .role-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.15s;}
  .role-opt:hover{border-color:#99f6e4;}
  .role-opt.active{border-color:var(--brand);background:#f0fdfa;box-shadow:0 0 0 3px rgba(15,118,110,.1);}
  .role-emoji{font-size:26px;}
  .role-name{font-size:13px;font-weight:800;color:var(--ink);}
  .role-sub{font-size:11px;color:var(--muted);font-weight:700;}
  .map-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px;}
  .legend-toggle{
    display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);
    padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);
  }
  .legend-toggle.on{border-color:var(--brand);color:var(--ink);background:#f0fdfa;}
  .legend-swatch{width:12px;height:12px;border-radius:50%;}
  .legend-swatch.rental{background:var(--brand);}
  .legend-swatch.public{background:#fff;border:2px solid #94a3b8;}
  .legend-vac{font-size:11.5px;color:var(--muted);}

  /* FORMS */
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;max-width:760px;}
  .panel h2{margin-top:0;}
  .form-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .field{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:700;color:var(--ink);}
  .field input,.field select,.field textarea{
    padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-family:inherit;background:#fff;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .checkrow{display:flex;gap:14px;flex-wrap:wrap;}
  .checkitem{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);border:1px solid var(--line);padding:8px 12px;border-radius:10px;}
  .btn-primary{
    background:var(--brand);color:#fff;border:none;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;
  }
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-secondary{background:#fff;border:1.5px solid var(--line);color:var(--ink);padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;}
  .btn-outline-brand{background:#fff;border:1.5px solid var(--brand);color:var(--brand-dark);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;}
  .success-box{background:var(--brand-light);border:1px solid var(--brand);border-radius:14px;padding:20px;margin-top:14px;}

  /* MODAL */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;
    display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;
  }
  .modal{
    background:#fff;border-radius:20px;max-width:820px;width:100%;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-close{
    position:absolute;top:14px;right:14px;background:#fff;border:1px solid var(--line);border-radius:999px;
    width:34px;height:34px;font-size:16px;line-height:1;z-index:5;
  }
  .modal-hero{
    height:220px;border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:center;font-size:70px;
  }
  .modal-body{padding:26px;}
  .modal-body h2{margin:0 0 4px;font-size:22px;}
  .muted{color:var(--muted);}
  .detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;margin-top:18px;}
  @media (max-width:640px){.detail-grid{grid-template-columns:1fr;}}
  .section-title{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px;}
  .amenity-list{display:flex;flex-wrap:wrap;gap:8px;}
  .review{border-top:1px solid var(--line);padding:12px 0;}
  .review-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;}
  .stars{color:var(--accent);letter-spacing:1px;}
  .price-card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px;position:sticky;top:90px;}
  .price-card .big{font-size:22px;font-weight:800;}
  .price-row{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;color:var(--muted);}
  .price-row.total{color:var(--ink);font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:15px;}
  .directions-link{
    display:flex;align-items:center;gap:6px;justify-content:center;margin-top:10px;font-size:13px;font-weight:700;
    color:var(--brand-dark);text-decoration:none;border:1.5px solid var(--brand);padding:10px;border-radius:10px;
  }
  .directions-link:hover{background:var(--brand-light);}

  .footer{text-align:center;padding:26px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);background:#fff;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.3);
  }
  .booking-row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .status-pill{background:var(--brand-light);color:var(--brand-dark);font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;}
</style>
</head>

<script>
const {
  useState,
  useEffect,
  useRef,
  useMemo
} = React;

/* ---------- FIREBASE (accounts + database) ----------
   Real host/driver accounts and a shared database. The whole integration
   sits behind the Auth object below, so the UI never calls Firebase directly
   and the app still runs (on localStorage) when Firebase isn't configured.

   TO ACTIVATE: paste the firebaseConfig from
   Firebase Console → Project Settings → General → Your apps → Config
   into FIREBASE_CONFIG. Until apiKey is filled, the app runs in local mode. */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCrXKKzqhokI9iUhSKtjwsuB-k-wiEKgaY",
  authDomain: "parkko-5b9ac.firebaseapp.com",
  projectId: "parkko-5b9ac",
  storageBucket: "parkko-5b9ac.firebasestorage.app",
  messagingSenderId: "706169047549",
  appId: "1:706169047549:web:9f6979bc4f45c5e5ddf194"
};
const FIREBASE_READY = !!FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined';

/* Auth abstraction. Firebase when configured; a localStorage stand-in
   otherwise so registration/login still demo without a backend. Both expose
   the same surface: current(), onChange(), register(), login(), logout(). */

const Auth = function () {
  let fb = null,
    fbAuth = null,
    fbDb = null;
  if (FIREBASE_READY) {
    fb = firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
  }

  // ----- localStorage fallback -----
  const LKEY = 'parkko_accounts',
    SKEY = 'parkko_session';
  function lAccounts() {
    try {
      return JSON.parse(localStorage.getItem(LKEY) || '{}');
    } catch (e) {
      return {};
    }
  }
  function lSaveAccounts(a) {
    try {
      localStorage.setItem(LKEY, JSON.stringify(a));
    } catch (e) {}
  }
  function lSession() {
    try {
      return JSON.parse(localStorage.getItem(SKEY) || 'null');
    } catch (e) {
      return null;
    }
  }
  function lSetSession(u) {
    try {
      u ? localStorage.setItem(SKEY, JSON.stringify(u)) : localStorage.removeItem(SKEY);
    } catch (e) {}
  }
  return {
    mode: FIREBASE_READY ? 'firebase' : 'local',
    onChange(cb) {
      if (FIREBASE_READY) {
        return fbAuth.onAuthStateChanged(async u => {
          if (!u) {
            cb(null);
            return;
          }
          let profile = {};
          try {
            const snap = await fbDb.collection('users').doc(u.uid).get();
            profile = snap.exists ? snap.data() : {};
          } catch (e) {}
          cb({
            uid: u.uid,
            email: u.email,
            ...profile
          });
        });
      }
      cb(lSession());
      return () => {};
    },
    async register({
      email,
      password,
      name,
      role
    }) {
      if (FIREBASE_READY) {
        const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
        const profile = {
          name,
          role,
          email,
          verified: false,
          createdAt: new Date().toISOString()
        };
        await fbDb.collection('users').doc(cred.user.uid).set(profile);
        return {
          uid: cred.user.uid,
          ...profile
        };
      }
      const accts = lAccounts();
      if (accts[email]) throw new Error('An account with that email already exists.');
      const u = {
        uid: 'local-' + email,
        email,
        name,
        role,
        verified: false,
        _pw: password
      };
      accts[email] = u;
      lSaveAccounts(accts);
      const session = {
        ...u
      };
      delete session._pw;
      lSetSession(session);
      return session;
    },
    async login({
      email,
      password
    }) {
      if (FIREBASE_READY) {
        await fbAuth.signInWithEmailAndPassword(email, password);
        return true;
      }
      const accts = lAccounts();
      const u = accts[email];
      if (!u || u._pw !== password) throw new Error('Wrong email or password.');
      const session = {
        ...u
      };
      delete session._pw;
      lSetSession(session);
      return session;
    },
    async logout() {
      if (FIREBASE_READY) {
        await fbAuth.signOut();
        return;
      }
      lSetSession(null);
    }
  };
}();

/* ---------- RENTAL PERIODS ----------
   Hosts price by the hour; longer stays derive from that with a discount,
   the way real lots price monthly cheaper than 720 separate hours. */

const RATE_PLANS = [{
  key: 'hour',
  label: 'Hourly',
  unit: 'hour',
  suffix: '/hr',
  multiplier: 1,
  discount: 0
}, {
  key: 'day',
  label: 'Daily',
  unit: 'day',
  suffix: '/day',
  multiplier: 10,
  discount: 0.15
}, {
  key: 'week',
  label: 'Weekly',
  unit: 'week',
  suffix: '/week',
  multiplier: 60,
  discount: 0.25
}, {
  key: 'month',
  label: 'Monthly',
  unit: 'month',
  suffix: '/month',
  multiplier: 220,
  discount: 0.35
}];
function planByKey(key) {
  return RATE_PLANS.find(p => p.key === key) || RATE_PLANS[0];
}

/* Rate for one unit of the given plan, rounded to a clean peso figure. */
function rateFor(spot, planKey) {
  const plan = planByKey(planKey);
  const raw = spot.price * plan.multiplier * (1 - plan.discount);
  if (plan.key === 'hour') return spot.price;
  return Math.round(raw / 5) * 5;
}
function savingsPct(spot, planKey) {
  const plan = planByKey(planKey);
  if (plan.key === 'hour') return 0;
  const undiscounted = spot.price * plan.multiplier;
  return Math.round((1 - rateFor(spot, planKey) / undiscounted) * 100);
}

/* ---------- VACANCY STORE (swappable backend) ----------
   Reports live behind this thin layer: localStorage today, Firebase the
   moment a config is wired in. The UI never touches the backend directly. */

const VacancyStore = {
  _local() {
    try {
      return JSON.parse(localStorage.getItem('parkko_vacancy') || '{}');
    } catch (e) {
      return {};
    }
  },
  getAll() {
    return this._local();
  },
  report(lotId, level) {
    // stamped time is passed in by the caller (no Date.now allowed at module load,
    // but this runs on a user click, so a fresh Date is fine here)
    const all = this._local();
    all[lotId] = {
      level,
      ts: new Date().toISOString()
    };
    try {
      localStorage.setItem('parkko_vacancy', JSON.stringify(all));
    } catch (e) {}
    return all;
  },
  // subscribe(cb): Firebase will push here; localStorage version is a no-op.
  subscribe(cb) {
    return () => {};
  }
};

    reader.onerror = () => reject(new Error('Could not read file'));

      img.onload = () => {
        let {
          width: w,
          height: h
        } = img;
        if (w > MAX_EDGE || h > MAX_EDGE) {
          const scale = MAX_EDGE / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);

        canvas.width = w;
        canvas.height = h;

    };

  });
